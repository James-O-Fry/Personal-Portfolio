
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Interactive Python Project</title>

    <link rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <link rel="stylesheet"
      href="../../styles.css">

    <script src="../../script.js" defer></script>
</head>

<body>

<nav class="navbar navbar-inverse">
    <div class="container-fluid">
        <ul class="nav navbar-nav">
            <li>
                <a href="../../index.html">Home</a>
            </li>
            <li>
                <a href="../../projects.html">Past Projects</a>
            </li>
            <li>
                <a href="../../resume.html">Current Resume</a>
            </li>
            <li>
                <a href="../../contact.html">Contact</a>
            </li>
        </ul>

        <button id="theme-toggle"
                class="btn navbar-btn navbar-right">
            Dark Mode
        </button>
    </div>
</nav>

<div class="container text-center">


<div class="container text-center">

    <h1>Interactive Python Project</h1>

    <p>Run my Python program directly in your browser!</p>

    <button id="run"
            class="btn btn-primary btn-lg"
            disabled>
        Loading Python...
    </button>

    <div class="game-terminal">

        <pre id="output">Initializing Python...</pre>

        <div class="input-area">

            <span class="prompt-symbol">&gt;</span>

            <input
                type="text"
                id="game-input"
                placeholder="Type your response..."
                disabled
                autocomplete="off"
            >

            <button
                id="submit-input"
                class="btn btn-success"
                disabled>
                Enter
            </button>

        </div>

    </div>

</div>

</div>

<script type="module">


import { loadPyodide } from
"https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.mjs";

const output = document.getElementById("output");
const button = document.getElementById("run");
const input = document.getElementById("game-input");
const submitButton = document.getElementById("submit-input");

let pyodide;
let resolveInput = null;

function writeOutput(text) {
    output.textContent += text + "\n";
    output.scrollTop = output.scrollHeight;
}

function webInput(promptText) {
    writeOutput(promptText);

    input.disabled = false;
    submitButton.disabled = false;
    input.focus();

    return new Promise((resolve) => {
        resolveInput = resolve;
    });
}

function submitInput() {
    if (!resolveInput) return;

    const value = input.value;

    writeOutput("> " + value);

    input.value = "";
    input.disabled = true;
    submitButton.disabled = true;

    const resolve = resolveInput;
    resolveInput = null;
    resolve(value);
}

submitButton.addEventListener("click", submitInput);

input.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
        submitInput();
    }
});

async function initializePython() {
    try {
        pyodide = await loadPyodide();

        pyodide.setStdout({
            batched: writeOutput
        });

        pyodide.setStderr({
            batched: writeOutput
        });

        // Make webInput available to Python
        pyodide.globals.set("web_input", webInput);

        button.disabled = false;
        button.textContent = "Run Python";
        output.textContent = "Python is ready!";

    } catch (error) {
        output.textContent = "Error loading Python: " + error;
    }
}

button.addEventListener("click", async () => {
    button.disabled = true;
    output.textContent = "";

    try {
        const response = await fetch("./script.py");

        if (!response.ok) {
            throw new Error("Unable to load Python script");
        }

        const pythonCode = await response.text();

        await pyodide.runPythonAsync(
            pythonCode + "\nawait main()"
        );

    } catch (error) {
        writeOutput("Error: " + error);

    } finally {
        input.disabled = true;
        submitButton.disabled = true;
        resolveInput = null;
        button.disabled = false;
    }
});

initializePython();

</script>

</body>
</html>
